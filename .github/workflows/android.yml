name: Android Build & Release

on:
  push:
    branches: [ "main","master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon \
          -Djava.awt.headless=true \
          -Dkotlin.compiler.execution.strategy=in-process \
          -Dksp.use.ksp2=true

    - name: Get version name
      id: version
      run: |
        VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}-${{ steps.sha.outputs.sha }}
        name: LocalDream ${{ steps.version.outputs.version }} (${{ steps.sha.outputs.sha }})
        body: |
          ## LocalDream ${{ steps.version.outputs.version }}
          
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Built:** ${{ github.event.head_commit.timestamp }}
          
          ### APK Files
          - `LocalDream_armv8a_${{ steps.version.outputs.version }}.apk` — Basic version
          - `LocalDream_armv8a_${{ steps.version.outputs.version }}_with_filter.apk` — With filter
          
          ### Installation
          1. Download the APK
          2. Enable "Install from unknown sources"
          3. Install on your arm64-v8a Android device (Android 9+)
        files: |
          app/build/outputs/apk/debug/*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
